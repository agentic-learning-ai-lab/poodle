# @package _global_

defaults:
  - _self_

experiment: train
sub_dir: flowe

# experiment args
benchmark: True
device: cuda
seed: 1
resume: null
resume_training: True
start_epoch: 0
checkpoint_freq: 1
visualize_freq: 1000
print_freq: 50
eval: False
eval_freq: 1000
vis: False
vis_freq: 1000
wandb: True
wandb_project: poodle

# routines
train_routine: poodle_train_one_epoch
eval_routine: poodle_evaluate
visualize_routine: poodle_visualize_batch

# distributed args
distributed: True
dist_eval: False

# training args
epochs: 300
accum_iter: 1
base_momentum: 0.996

# data parameters
dataset: bdd100k_flowe
batch_size: 2
dataset_configs:
  data_dir: '/vast/work/public/ml-datasets/bdd100k/videos'
  meta_info_file: null
  delta_t: [15, 30]
  repeat_sample: 2
  initial_size: [810, 1350]
  crop_size: [512, 1024]
  backend: torchvision-videoreader

eval_dataset: kitti
eval_dataset_configs:
  data_dir: '/scratch/ch3451/datasets/kitti-flow-2015/data_scene_flow'
  img_size: [256, 832]
  norm_mean: [0, 0, 0]
  norm_std: [1, 1, 1]

num_workers: null
pin_memory: True

# model parameters
model: flowe
model_configs:
  flow_model_checkpoint: '/scratch/ch3451/models/raft/raft-things.pth'
  occlusion_threshold: 3.54 # 10 / root(8)

# loss weights
loss_weights: 
  ssl: 1.0

# optimizer parameters
optimizer: adamw
clip_grad: null
weight_decay: 1e-2
lr: 5e-4
blr: null
min_lr: 1e-4
warmup_epochs: 2
fp16: False
